<body class="home-page">
    <div class="description-ovelay">
        <div class="descrption-close"><span>&times;</span></div>
        <div class="descrption-content">
            <div class="description-header">
                <h3></h3>
            </div>
            <div class="descripption-view">

            </div>
        </div>
    </div>

    <div class="media-overlay" role="dialog" aria-modal="true" aria-label="Favourite song player">
        <button type="button" class="media-close" aria-label="Close favourite song player"><span>&times;</span></button>
        <div class="media-content">
            <div class="beatsync">
                <div class="beatsync-photo"></div>
                <div class="beatsync-glow" aria-hidden="true"></div>
                <span class="beatsync-badge"><i class="fas fa-music"></i> Now playing</span>
                <div class="beatsync-eq" aria-hidden="true">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
            <div class="quote-content">
                <p class="media-kicker">Favourite song</p>
                <h3 class="media-name">Class of 2017</h3>
                <p class="media-quote"></p>
                <div class="media-progress" aria-hidden="true"><span></span></div>
                <div class="media-times">
                    <span class="media-current">0:00</span>
                    <span class="media-duration">0:00</span>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-animation">
        <div class="phone">
            <div class="phone-notch"></div>
            <div class="phone-screen">
                <div class="phone-status">
                    <span>MMXVII</span>
                    <span>2017</span>
                </div>
                <img class="phone-logo" src="logo.png" alt="Alumni MMXVII logo" loading="eager">
                <div class="phone-copy">
                    <h2>Alumni MMXVII</h2>
                    <p>Class of 2017</p>
                </div>
                <div class="phone-loader" aria-hidden="true">
                    <span class="phone-spinner"></span>
                    <span class="phone-progress"><span></span></span>
                    <p class="phone-loading-text">Loading memories</p>
                </div>
                <div class="phone-home"></div>
            </div>
        </div>

        <button type="button" class="intro-trailer">
            <i class="fas fa-play"></i> Watch the trailer
        </button>
    </div>
    
    <div class="video-overlay">
        <div class="video-close"><span>&times;</span></div>
        <div class="video-content">
          <video src="readers/vid.mp4" preload="metadata"></video>
          <div class="video-controls">
            <div class="progress-truck">
              <div class="progress-bar"></div>
            </div>
            <div class="video-buttons">
              <button>&#9654;</button>
              <button title="play"><i class="fas fa-volume-up"></i></button>
            </div>
          </div>
        </div>
      
        
      </div>
      

    <main>
        <div class="student-container">
          <ul></ul>
        </div>
      </main>

    <footer class="site-footer">
        <p>Alumni MMXVII &mdash; Class of 2017. <a href="students/">Browse all student profiles</a> &middot; <a href="trailer/">Watch the trailer</a> &middot; <a href="add-student/">Add a new student</a></p>
    </footer>
